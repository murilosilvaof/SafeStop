[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

; A placa está ligada no USB do notebook
upload_port = COM3
monitor_port = COM3

; O firmware está na raiz do projeto para facilitar a demo
src_dir = .

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
